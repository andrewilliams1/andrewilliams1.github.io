name: Build résumé and site

# One run per change: every push to main builds and deploys.
# (Merging a PR is a push to main, so the same applies.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Minimal TeX Live with only the packages the résumé uses. Cached after
      # the first run, so later runs restore it in seconds instead of
      # downloading Ubuntu's multi-gigabyte font bundle every time.
      # If a build ever fails with "File `something.sty' not found",
      # add that package name to the list below.
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            scheme-basic latexmk
            xcolor enumitem etoolbox xkeyval iftex
            fira fontaxes mweights fontawesome ec
            anyfontsize needspace preprint

      - name: Add TeX Live to PATH
        run: echo "$HOME/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
